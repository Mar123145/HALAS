<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Healed And Loved Animal Sanctuary (HALAS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen text-gray-900">
    <nav class="sticky top-0 z-50 border-b border-gray-200 bg-white/95 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <a href="dashboard.html" class="font-bold text-2xl text-blue-600">
                <span>HALAS</span>
            </a>

            <div class="hidden md:flex items-center gap-1">
                <a href="dashboard.html" class="px-3 py-2 rounded-lg bg-blue-50 text-blue-700 font-semibold">Dashboard</a>
                <a href="browse.html" class="px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">Browse</a>
                <a href="saved-pets.html" class="px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">Saved</a>
                <a href="messages.html" class="px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">Messages</a>
                <a href="profile.html" class="px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">Profile</a>
                <button id="logoutBtn" type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 border border-gray-200 hover:bg-gray-50 text-gray-700 font-medium rounded-xl">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Log Out
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <section class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 sm:p-8 mb-6">
            <p class="text-gray-500 font-medium mb-2">Adoption Progress</p>
            <h1 class="text-4xl font-bold">My Applications</h1>
            <p class="text-gray-500 mt-2 max-w-2xl">Track every adoption request you submitted and review the details the shelter team is using.</p>
        </section>

        <section class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
                <p class="text-sm text-gray-500 mb-2">Total Applications</p>
                <p id="totalCount" class="text-3xl font-bold text-gray-900">0</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
                <p class="text-sm text-gray-500 mb-2">Active Review</p>
                <p id="activeCount" class="text-3xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
                <p class="text-sm text-gray-500 mb-2">Decisions</p>
                <p id="decisionCount" class="text-3xl font-bold text-green-600">0</p>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 mb-8">
            <div class="grid md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label for="searchInput" class="block text-sm font-medium text-gray-700">Search Applications</label>
                    <div class="relative mt-1">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-2.5"></i>
                        <input id="searchInput" type="text" placeholder="Search pet, applicant, status, or email" class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label for="statusFilter" class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="statusFilter" class="mt-1 px-4 py-2 w-full border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="reviewing">Reviewing</option>
                        <option value="visit scheduled">Visit Scheduled</option>
                        <option value="visit completed">Visit Completed</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="applicationsList" class="space-y-6">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-10 text-center">
                <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-600">Loading applications...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        import {
            getFirestore,
            collection,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
        import { firebaseConfig } from "../firebase-config.js";


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const logoutBtn = document.getElementById("logoutBtn");
        const applicationsList = document.getElementById("applicationsList");
        const searchInput = document.getElementById("searchInput");
        const statusFilter = document.getElementById("statusFilter");
        const totalCount = document.getElementById("totalCount");
        const activeCount = document.getElementById("activeCount");
        const decisionCount = document.getElementById("decisionCount");

        let applications = [];

        function normalizeStatus(status) {
            return String(status || "pending").trim().toLowerCase();
        }

        function formatDate(value) {
            if (!value) return "Not set";
            const date = value.toDate ? value.toDate() : new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString();
        }

        function timestampMillis(value) {
            if (!value) return 0;
            if (value.toDate) return value.toDate().getTime();
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? 0 : parsed.getTime();
        }

        function badge(status) {
            const normalized = normalizeStatus(status);
            if (normalized === "approved" || normalized === "visit completed") return "bg-green-100 text-green-700";
            if (normalized === "rejected" || normalized === "cancelled") return "bg-red-100 text-red-700";
            if (normalized === "reviewing" || normalized === "visit scheduled") return "bg-blue-100 text-blue-700";
            return "bg-yellow-100 text-yellow-700";
        }

        function listValue(value, fallback = "Not set") {
            if (Array.isArray(value)) return value.length ? value.join(", ") : fallback;
            return value || fallback;
        }

        function renderStats() {
            const active = applications.filter((app) => {
                const status = normalizeStatus(app.status);
                return !["approved", "rejected", "cancelled"].includes(status);
            }).length;

            totalCount.textContent = applications.length;
            activeCount.textContent = active;
            decisionCount.textContent = applications.length - active;
        }

        function filteredApplications() {
            const search = searchInput.value.trim().toLowerCase();
            const selectedStatus = statusFilter.value;

            return applications.filter((app) => {
                const status = normalizeStatus(app.status);
                const haystack = [
                    app.petName,
                    app.applicantName,
                    app.adopterName,
                    app.email,
                    app.applicantEmail,
                    app.contactNumber,
                    status
                ].filter(Boolean).join(" ").toLowerCase();

                return (selectedStatus === "all" || status === selectedStatus)
                    && (!search || haystack.includes(search));
            });
        }

        function renderApplications() {
            renderStats();
            const items = filteredApplications();

            if (!items.length) {
                applicationsList.innerHTML = `
                    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-12 text-center">
                        <i data-lucide="file-text" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">No applications found</h2>
                        <p class="text-gray-600 mb-6">Applications you submit will appear here.</p>
                        <a href="browse.html" class="inline-flex items-center justify-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-colors">Browse Pets</a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            applicationsList.innerHTML = items.map((app) => {
                const status = app.status || "pending";
                const petName = app.petName || "Selected pet";
                const applicantName = app.applicantName || app.adopterName || "Applicant";
                const petLink = app.petId ? `pet-details.html?id=${encodeURIComponent(app.petId)}` : "browse.html";

                return `
                    <article class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
                        <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-5">
                            <div>
                                <div class="flex flex-wrap items-center gap-3 mb-2">
                                    <h2 class="text-2xl font-bold text-gray-900">${petName}</h2>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${badge(status)}">${status}</span>
                                </div>
                                <p class="text-gray-500">Submitted by ${applicantName} on ${formatDate(app.createdAt || app.submittedAt || app.date)}</p>
                            </div>
                            <a href="${petLink}" class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium">View Pet</a>
                        </div>

                        <div class="grid md:grid-cols-3 gap-4 mt-6">
                            <div class="rounded-lg bg-blue-50 p-4">
                                <p class="text-sm text-gray-500">Contact</p>
                                <p class="font-semibold text-gray-900">${app.applicantEmail || app.email || "Not set"}</p>
                            </div>
                            <div class="rounded-lg bg-green-50 p-4">
                                <p class="text-sm text-gray-500">Home Type</p>
                                <p class="font-semibold text-gray-900">${app.homeType || "Not set"}</p>
                            </div>
                            <div class="rounded-lg bg-amber-50 p-4">
                                <p class="text-sm text-gray-500">Schedule</p>
                                <p class="font-semibold text-gray-900">${app.dailySchedule || "Not set"}</p>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-4 mt-5">
                            <div class="rounded-lg bg-indigo-50 p-4">
                                <p class="text-sm text-gray-500">Preferred Visit Days</p>
                                <p class="font-semibold text-gray-900">${listValue(app.preferredVisitDays)}</p>
                            </div>
                            <div class="rounded-lg bg-indigo-50 p-4">
                                <p class="text-sm text-gray-500">Preferred Visit Times</p>
                                <p class="font-semibold text-gray-900">${listValue(app.preferredVisitTimes)}</p>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-4 mt-5">
                            <div>
                                <h3 class="font-semibold text-gray-900 mb-1">Reason</h3>
                                <p class="text-sm text-gray-600 whitespace-pre-wrap">${app.adoptionReason || "No reason provided."}</p>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-900 mb-1">Care Plan</h3>
                                <p class="text-sm text-gray-600 whitespace-pre-wrap">${app.carePlan || "No care plan provided."}</p>
                            </div>
                        </div>
                    </article>
                `;
            }).join("");

            lucide.createIcons();
        }

        async function loadApplications(user) {
            const snapshot = await getDocs(query(
                collection(db, "applications"),
                where("userId", "==", user.uid)
            ));

            applications = snapshot.docs.map((docSnap) => ({
                id: docSnap.id,
                ...docSnap.data()
            })).sort((a, b) => timestampMillis(b.createdAt || b.submittedAt || b.date) - timestampMillis(a.createdAt || a.submittedAt || a.date));

            renderApplications();
        }

        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "../login.html";
        });

        searchInput.addEventListener("input", renderApplications);
        statusFilter.addEventListener("change", renderApplications);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "../login.html";
                return;
            }

            try {
                await loadApplications(user);
            } catch (error) {
                console.error("Application load error:", error);
                applicationsList.innerHTML = `
                    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-12 text-center">
                        <i data-lucide="alert-circle" class="w-16 h-16 text-red-300 mx-auto mb-4"></i>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Unable to load applications</h2>
                        <p class="text-gray-600">Please check your Firestore rules and try again.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        });

        lucide.createIcons();
    </script>
    <script src="../mobile-nav.js"></script>
</body>
</html>
