<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Healed And Loved Animal Sanctuary (HALAS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen text-gray-900">
    <nav class="sticky top-0 z-50 border-b border-gray-200 bg-white/95 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="font-bold text-2xl text-blue-600">
            <span>HALAS</span>
        </a>
        <div class="flex items-center gap-2">
            <a href="about.html" class="hidden sm:inline-flex px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">About</a>
            <a href="login.html" class="inline-flex items-center justify-center px-4 py-2 border border-gray-200 hover:bg-gray-50 text-gray-700 font-medium rounded-xl transition-colors text-center">
                Log In
            </a>
        </div>
        </div>
    </nav>

    <main class="min-h-[calc(100vh-88px)] flex items-center justify-center px-4 py-12">
        <section class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-sm p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="key-round" class="w-8 h-8"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Reset your password</h1>
                <p class="text-gray-600 mt-3">
                    Enter your account email and we will send a secure password reset link.
                </p>
            </div>

            <form id="forgotPasswordForm" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <div class="relative mt-1">
                        <i data-lucide="mail" class="w-5 h-5 text-gray-400 absolute left-3 top-2.5"></i>
                        <input id="email" name="email" type="email" required placeholder="Enter your email"
                            class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <button id="resetBtn" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-colors">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="login.html" class="inline-flex items-center gap-2 text-sm text-blue-600 hover:text-blue-700 font-medium">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back to login
                </a>
            </div>
        </section>
    </main>

    <div id="messageModal" class="hidden fixed inset-0 bg-black/40 z-[110] flex items-center justify-center px-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <div id="messageIcon" class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="info" class="w-7 h-7 text-blue-600"></i>
            </div>
            <h2 id="messageTitle" class="text-2xl font-bold text-gray-900 text-center mb-2">Message</h2>
            <p id="messageText" class="text-gray-600 text-center mb-6"></p>
            <button id="messageCloseBtn" type="button" class="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-colors">
                OK
            </button>
        </div>
    </div>

    <script type="module">
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        import { auth } from "./firebase-app.js";

        const forgotPasswordForm = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const resetBtn = document.getElementById("resetBtn");
        const messageModal = document.getElementById("messageModal");
        const messageIcon = document.getElementById("messageIcon");
        const messageTitle = document.getElementById("messageTitle");
        const messageText = document.getElementById("messageText");
        const messageCloseBtn = document.getElementById("messageCloseBtn");

        function setLoading(isLoading) {
            resetBtn.disabled = isLoading;
            resetBtn.classList.toggle("opacity-70", isLoading);
            resetBtn.classList.toggle("cursor-not-allowed", isLoading);
            resetBtn.innerHTML = isLoading
                ? `<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> Sending...`
                : `<i data-lucide="send" class="w-4 h-4"></i> Send Reset Link`;
            lucide.createIcons();
        }

        function showMessage(type, title, text) {
            messageTitle.textContent = title;
            messageText.textContent = text;

            if (type === "success") {
                messageIcon.className = "w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-4";
                messageIcon.innerHTML = '<i data-lucide="check" class="w-7 h-7 text-green-600"></i>';
            } else {
                messageIcon.className = "w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4";
                messageIcon.innerHTML = '<i data-lucide="x" class="w-7 h-7 text-red-600"></i>';
            }

            messageModal.classList.remove("hidden");
            lucide.createIcons();
        }

        messageCloseBtn.addEventListener("click", () => {
            messageModal.classList.add("hidden");
        });

        forgotPasswordForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            if (!email) {
                showMessage("error", "Email Required", "Please enter your email address.");
                return;
            }

            setLoading(true);

            try {
                await sendPasswordResetEmail(auth, email);
                forgotPasswordForm.reset();
                showMessage("success", "Reset Link Sent", "If an account exists for this email, a password reset link has been sent. Please check your inbox.");
            } catch (error) {
                if (error.code === "auth/invalid-email") {
                    showMessage("error", "Invalid Email", "Please enter a valid email address.");
                } else if (error.code === "auth/too-many-requests") {
                    showMessage("error", "Too Many Attempts", "Please wait a while before requesting another reset link.");
                } else {
                    showMessage("error", "Reset Failed", "Unable to send the reset link right now. Please try again.");
                }
            } finally {
                setLoading(false);
            }
        });

        lucide.createIcons();
    </script>
    <script src="mobile-nav.js"></script>
</body>
</html>
